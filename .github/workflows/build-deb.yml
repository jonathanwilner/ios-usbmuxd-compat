name: Debian package lifecycle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and exercise lifecycle without hardware
        run: ./scripts/container-deb-test.sh '${{ matrix.image }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ strategy.job-index }}
          path: dist/
