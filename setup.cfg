[metadata]
name = ios-usbmuxd-compat
version = 0.1.0
description = Reference iPhone USB diagnostics and reversible compatibility management
license = MIT
author = ios-usbmuxd-compat contributors
classifiers =
    Operating System :: POSIX :: Linux
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    ios-usbmuxd-wrap = ios_usbmuxd_compat.wrapper:main
    iphone-connectivity-demo = iphone_connectivity_demo:main
    ios-usbmuxd-compat = ios_usbmuxd_compat.cli:main
